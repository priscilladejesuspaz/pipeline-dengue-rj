services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dengue_pgdata:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:3.3.2
    depends_on:
      - postgres
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/   # tasks (scheduler) falam com a API por este endereço
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-jwt-secret-troque-em-producao}   # segredo igual em todos os serviços
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"   # cria o usuário "airflow" com papel "admin"
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate"
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-api-server:                # interface web, em http://localhost:8080
    image: apache/airflow:3.3.2
    depends_on:
      - airflow-init
    environment: *airflow-env        # "*airflow-env" reaproveita o bloco marcado acima, sem repetir
    ports:
      - "8080:8080"
    command: api-server
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

  airflow-scheduler:                 # decide quando cada task deve rodar
    image: apache/airflow:3.3.2
    depends_on:
      - airflow-init
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

  airflow-dag-processor:             # lê seus arquivos .py em /dags e interpreta as DAGs
    image: apache/airflow:3.3.2
    depends_on:
      - airflow-init
    environment: *airflow-env
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

  airflow-triggerer:                 # gerencia tasks "adiáveis" (espera assíncrona, sem gastar worker)
    image: apache/airflow:3.3.2
    depends_on:
      - airflow-init
    environment: *airflow-env
    command: triggerer
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs

volumes:
  dengue_pgdata: